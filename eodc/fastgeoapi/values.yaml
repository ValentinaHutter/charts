image:
  repository: registry.eodc.eu/eodc/eodc-api/fastgeoapi
  tag: "0.4.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicas: 1
workers: 4
contextPath: /geoapi
baseUrl: ""
logLevel: error

postgres:
  secretName: postgres-credentials
  secretKey: postgresPassword

# S3 credentials for GeoParquet collections:
s3:
  secretName: ""
  accessKeyIdKey: AWS_ACCESS_KEY_ID
  secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

config:
  data: ""

resources: {}

# Authorisation with OPA (fastgeoapi's built-in OPA mode, OPA as sidecar)
opa:
  enabled: false
  image: openpolicyagent/opa:1.22.0
  collectionGroups: {}
  publicPaths: []

# Keycloak client used by fastgeoapi in OPA mode
oidc:
  wellKnownEndpoint: ""
  clientId: ""
  clientSecretName: ""