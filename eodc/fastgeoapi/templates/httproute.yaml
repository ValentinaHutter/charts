apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-route
  labels:
    app.kubernetes.io/name: fastgeoapi
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required (copy from pygeoapi-route)" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- required "httpRoute.hostnames is required" .Values.httpRoute.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | default "/" }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: 80